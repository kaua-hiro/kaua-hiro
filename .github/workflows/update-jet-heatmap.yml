name: Update jet heatmap SVG

# Refreshes the jet-over-contribution-grid SVG daily from real contribution data.

on:
  schedule:
    - cron: "30 5 * * *"
  workflow_dispatch: {}
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Generate SVG
        env:
          GH_USERNAME: kaua-hiro
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          OUTPUT_PATH: dist/github-jet.svg
        run: node scripts/generate-jet-heatmap.mjs

      - name: Commit and push if changed
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "chore: update jet heatmap SVG [skip ci]"
          file_pattern: dist/github-jet.svg
