name: Update jet heatmap SVG

# Regenerates the heatmap weekly and publishes it to the `output` branch
# (force-pushed, single commit) so `main` history stays clean.

on:
  schedule:
    - cron: "0 6 * * 1"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Generate SVG
        env:
          GH_USERNAME: kaua-hiro
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          OUTPUT_PATH: dist/github-jet.svg
        run: node scripts/generate-jet-heatmap.mjs

      - name: Publish to output branch
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
          keep_history: false
          jekyll: false
          commit_message: "chore: publish heatmap"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
